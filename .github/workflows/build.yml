name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Cache mutations
        id: mutations
        uses: actions/cache@v4
        with:
          path: web-api/target/pit-reports
          key: ${{ runner.os }}-pitest-${{ hashFiles('**/pom.xml') }}
      - name: Calculate Mutation Score
        if: steps.mutations.outputs.cache-hit == 'true'
        id: oldScore
        run: |
          killedMutants=$(grep -e "KILLED" -c web-api/target/pit-reports/mutations.csv)
          totalMutants=$(grep -ce . web-api/target/pit-reports/mutations.csv)
          echo $killedMutants/$totalMutants
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test
      - name: Run Maven Tests ${{ matrix.java-version }} in web-api
        run: mvn -f ./web-api test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Compare mutations
        if: steps.mutations.outputs.cache-hit == 'true'
        run: |
          a=$(grep -c -e "KILLED" web-api/target/pit-reports/mutations.csv)
          b=$(grep -ce . web-api/target/pit-reports/mutations.csv)
          echo ${{ steps.oldScore.killedMutants }}/${{ steps.oldScore.totalMutants }}
          echo $a/$b
          
          if [ $($b * ${{ steps.oldScore.killedMutants }} ) -gt $( $a * ${{ steps.oldScore.totalMutants }}) ]; then
            exit 1
          fi

